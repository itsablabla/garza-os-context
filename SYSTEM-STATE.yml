# KNOWN ISSUES
# ═══════════════════════════════════════════════════════════

issues:
  - id: "H1-CONTAINERS-DOWN"
    severity: critical
    description: "9 Docker containers returning 502 on H1 (72.62.86.63)"
    affected:
      - research.garzaos.cloud (DeerFlow)
      - agentzero.garzaos.cloud (Agent Zero)
      - search.garzaos.cloud (Perplexica)
      - akaunting.garzaos.cloud (Akaunting)
      - invio.garzaos.cloud (Invio)
      - superglue.garzaos.cloud (Superglue)
      - maxkb.garzaos.cloud (MaxKB)
      - maxkb1.garzaos.cloud (MaxKB1)
      - mcpfactory-nomad.garzaos.cloud
    workaround: "Need SSH access to H1 to restart containers"

  - id: "SSH-AUTH-FAIL"
    severity: critical
    description: "VPS_ROOT_PASSWORD rejected on both H1 and H2"
    workaround: "Password may have been rotated or SSH password auth disabled. Update secret."

  - id: "PROTONMAIL-MCP-DOWN"
    severity: high
    description: "protonmail.garzaos.cloud/mcp returning 502"
    workaround: "Container on H1 not responding — needs restart"

  - id: "RAILWAY-TOKEN-EXPIRED"
    severity: medium
    description: "RAILWAY_API_TOKEN returning 'Not Authorized' on GraphQL API"
    workaround: "Regenerate token at https://railway.com/account/tokens"

  - id: "AUTO2-5-ORPHAN-DNS"
    severity: low
    description: "auto2-5.garzaos.cloud DNS records exist but no Traefik routes configured (404)"
    workaround: "Either deploy Sim Studio instances or clean up stale DNS"

  - id: "H2-PURPOSE-UNKNOWN"
    severity: low
    description: "H2 (187.77.25.131) running but no known services mapped"
    workaround: "Need SSH access to inspect"

  - id: "ID-PURPOSE-UNKNOWN"
    severity: low
    description: "Infomaniak 'Garza' (83.228.193.101) serving nginx default page"
    workaround: "Need SSH access or Infomaniak dashboard to inspect"

