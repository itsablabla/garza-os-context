name: Regenerate repo index

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gh CLI
        run: |
          # gh is preinstalled on ubuntu-latest
          gh --version
      - name: Pull full repo list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/data
          gh api --paginate -H "Accept: application/vnd.github+json" \
            "/users/itsablabla/repos?per_page=100&type=all" \
            --jq '.[] | [.full_name,.name,.private,.fork,.archived,.size,.pushed_at,.language,.default_branch,(.topics // [] | join(" "))] | @csv' \
            > docs/data/ITSABLABLA-REPOS.csv.new
          echo "full_name,name,private,fork,archived,size,pushed_at,language,default_branch,topics" > docs/data/ITSABLABLA-REPOS.csv
          cat docs/data/ITSABLABLA-REPOS.csv.new >> docs/data/ITSABLABLA-REPOS.csv
          rm docs/data/ITSABLABLA-REPOS.csv.new
      - name: Rebuild index markdown
        run: |
          python3 - <<'PY'
          import csv
          rows = []
          with open('docs/data/ITSABLABLA-REPOS.csv') as f:
              rows = list(csv.DictReader(f))

          # Simple markdown summary grouped by topic
          lines = ['# itsablabla/* repo index (autogenerated)','',
                   f'Total: {len(rows)} repos','']

          from collections import defaultdict
          by_topic = defaultdict(list)
          for r in rows:
              topics = (r.get('topics') or '').split()
              brand = next((t for t in topics if t in ('garza-os','nomad-os','last-rock-labs','jada','cross-brand')), 'unsorted')
              by_topic[brand].append(r)

          for brand in sorted(by_topic):
              bucket = by_topic[brand]
              lines.append(f'## {brand} ({len(bucket)})')
              lines.append('')
              lines.append('| Repo | Tier | Lifecycle | Private | Fork | Archived |')
              lines.append('|---|---|---|---|---|---|')
              for r in sorted(bucket, key=lambda x: x['name'].lower()):
                  topics = (r.get('topics') or '').split()
                  tier = next((t for t in topics if t.startswith('tier-')),'').replace('tier-','') or '—'
                  life = next((t for t in topics if t.startswith('lifecycle-')),'').replace('lifecycle-','') or '—'
                  def yn(v): return 'yes' if str(v).lower() == 'true' else 'no'
                  lines.append(f"| [{r['name']}](https://github.com/{r['full_name']}) | {tier} | {life} | {yn(r['private'])} | {yn(r['fork'])} | {yn(r['archived'])} |")
              lines.append('')

          with open('docs/data/ITSABLABLA-REPOS.md','w') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - name: Open PR with updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to index."
            exit 0
          fi
          BR="bot/regen-index-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add docs/data/ITSABLABLA-REPOS.csv docs/data/ITSABLABLA-REPOS.md
          git commit -m "chore: weekly repo index refresh"
          git push origin "$BR"
          gh pr create --title "Weekly repo index refresh" \
            --body "Auto-regenerated by regen-index.yml. Review + merge." \
            --base main --head "$BR" || true
